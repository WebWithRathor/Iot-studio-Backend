# Stage 1 (before certificates exist): HTTP only, so certbot can answer the
# ACME challenge for both hostnames. Install as /etc/nginx/conf.d/kokoon-iot.conf,
# run certbot (see deploy/DEPLOY.md), then replace it with kokoon-iot.conf.
server {
    listen 80;
    listen [::]:80;
    server_name api.iot.test.kokoon.pixxo.io mqtt.test.kokoon.pixxo.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
