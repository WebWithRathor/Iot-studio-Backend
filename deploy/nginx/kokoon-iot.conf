# IoT Studio API behind the EC2's existing nginx. Install as
# /etc/nginx/conf.d/kokoon-iot.conf (replacing the stage-1 kokoon-iot.http.conf).
# mqtt.test.kokoon.pixxo.io is only here for its certificate's HTTP challenge:
# MQTT itself goes straight to the broker container on 8883, not through nginx.
server {
    listen 80;
    listen [::]:80;
    server_name api.iot.test.kokoon.pixxo.io mqtt.test.kokoon.pixxo.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.iot.test.kokoon.pixxo.io;

    ssl_certificate     /etc/letsencrypt/live/api.iot.test.kokoon.pixxo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.iot.test.kokoon.pixxo.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The API's own JSON limits are smaller; this only stops huge uploads early.
    client_max_body_size 2m;

    location / {
        # pm2 process kokoon-iot-backend, HOST=127.0.0.1 PORT=4004 in its .env
        proxy_pass http://127.0.0.1:4004;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1: the API takes the client IP from the last hop here.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live device updates are Server-Sent Events: the API already sends
        # X-Accel-Buffering: no; keep idle streams open between heartbeats.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
