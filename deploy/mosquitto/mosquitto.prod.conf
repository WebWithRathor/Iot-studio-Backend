# Production broker for MQTT_MODE=broker + BROKER_CREDENTIALS_MODE=mosquitto-dynsec.
# Same accounts/limits as docker/mosquitto/mosquitto-dynsec.conf, plus TLS:
# boards and the backend connect to mqtts://mqtt.test.kokoon.pixxo.io:8883.
# Plain 1883 listens inside the container only (healthcheck, mosquitto_ctrl via
# `docker exec`); it is never published, so no plaintext leaves the container.
# Image: eclipse-mosquitto:2.0.22.

per_listener_settings false
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# --- TLS, public ---
# Let's Encrypt cert copied in by deploy/certbot-mqtt-deploy-hook.sh (owner 1883,
# key 0600). Mosquitto re-reads both files on SIGHUP, which the hook sends.
listener 8883 0.0.0.0
max_connections -1
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# --- plaintext, container-local ---
listener 1883 127.0.0.1
max_connections 16

# --- limits ---
# Whole MQTT packet: payload ≤4096 bytes + topic ≤200 chars + headers (contract C).
max_packet_size 8192
# Per client. Boards use clean sessions and QoS ≤1; the backend gets bursts of acks/availability.
max_inflight_messages 20
max_queued_messages 1000
queue_qos0_messages false
set_tcp_nodelay true
# Not set on purpose: max_keepalive also refuses MQTT 3.1.1 clients that ask for keepalive 0
# (umqtt's default), which would lock out boards with older firmware.
# max_keepalive 120

# --- persistence ---
# Retained messages and sessions → /mosquitto/data/mosquitto.db, saved every 5 min and on shutdown.
# The dynsec plugin writes dynamic-security.json itself, after every account change.
# Both are in the broker-data volume; deploy/backup-broker.sh copies them out.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
persistent_client_expiration 1d

log_dest stdout
log_type error
log_type warning
log_type notice
# Logs client takeovers (two boards with one client id) and auth failures.
connection_messages true
