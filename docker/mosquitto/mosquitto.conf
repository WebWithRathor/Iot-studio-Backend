# Development broker for MQTT_MODE=broker. Not a production configuration:
# production needs TLS (listener 8883 + certfile/keyfile) and per-device credentials
# (use mosquitto-dynsec.conf). Limits match mosquitto-dynsec.conf.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

listener 1883 0.0.0.0
max_connections -1

max_packet_size 8192
max_inflight_messages 20
max_queued_messages 1000
queue_qos0_messages false
set_tcp_nodelay true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
